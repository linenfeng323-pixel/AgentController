<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>RedTeam AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0e1a;color:#e6e8ef;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:linear-gradient(90deg,#1a0a2e,#0a0e1a);border-bottom:1px solid #2a1a4a;flex-shrink:0}
h1{font-size:17px;color:#ff4466}h1 small{color:#8866aa;font-weight:400;font-size:12px;margin-left:6px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5}
.msg.user{align-self:flex-end;background:#1a3a6a;color:#ddeeff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#1a1a2e;color:#eef;border-bottom-left-radius:4px;border-left:2px solid #ff4466}
.msg.ai b{color:#ff6688;font-size:12px;display:block;margin-bottom:4px}
.msg.loading{align-self:flex-start;background:#1a1a2e;color:#8866aa;font-style:italic}
.typing{display:inline-block;width:6px;height:6px;background:#8866aa;border-radius:50%;margin:0 2px;animation:bounce .6s infinite}
.typing:nth-child(2){animation-delay:.15s}.typing:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
#bar{flex-shrink:0;padding:10px 12px;background:#0f1428;border-top:1px solid #1e2448;display:flex;gap:8px;align-items:center}
#input{flex:1;padding:10px 14px;border-radius:20px;background:#0a0f20;color:#eef;border:1px solid #2a2a5a;outline:none;font-size:14px;resize:none;max-height:120px;min-height:42px;line-height:1.4}
#input:focus{border-color:#ff4466}
#send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#cc2255,#ff4466);border:0;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.4}
.status{font-size:11px;color:#666;padding:0 16px 6px;flex-shrink:0}
.status .ok{color:#66ff99}.status .no{color:#ff6688}
</style>
</head>
<body>
<header>
<h1>RedTeam AI <small>输入大白话，自动执行红队操作</small></h1>
</header>
<div id="chat"></div>
<div class="status" id="status">连接中...</div>
<div id="bar">
<textarea id="input" rows="1" placeholder="输入你的需求...&#10;例如：逆向分析 /sdcard/app.apk&#10;例如：扫描 192.168.1.1 端口&#10;例如：检查设备安全漏洞"></textarea>
<button id="send" onclick="send()">➤</button>
</div>
<script>
const BASE=location.origin;
let rpcId=0,connected=false;
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const sendBtn=document.getElementById('send');
const statusEl=document.getElementById('status');

// 自动调整输入框高度
input.addEventListener('input',()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,120)+'px';
});
// 回车发送（Shift+Enter换行）
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

async function rpc(method,params){
  const id=++rpcId;
  const r=await fetch(BASE+'/mcp',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',method,params,id})});
  return await r.json();
}

function addMsg(cls,text,sender){
  const d=document.createElement('div');
  d.className='msg '+cls;
  if(sender){d.innerHTML='<b>'+sender+'</b>'+escapeHtml(text);}
  else{d.textContent=text;}
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
function escapeHtml(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function showLoading(){
  const d=document.createElement('div');
  d.className='msg loading';
  d.id='loadingMsg';
  d.innerHTML='执行中<span class="typing"></span><span class="typing"></span><span class="typing"></span>';
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
function hideLoading(){const e=document.getElementById('loadingMsg');if(e)e.remove();}

async function send(){
  const text=input.value.trim();
  if(!text||!connected)return;
  addMsg('user',text);
  input.value='';
  input.style.height='auto';
  sendBtn.disabled=true;
  showLoading();
  try{
    const r=await rpc('tools/call',{name:'chat',arguments:{input:text}});
    hideLoading();
    if(r.error){
      addMsg('ai','错误: '+(r.error.message||JSON.stringify(r.error)),'❌');
    }else{
      const resultText=r.result?.content?.[0]?.text||JSON.stringify(r.result);
      addMsg('ai',resultText,'RedTeam AI');
    }
  }catch(e){
    hideLoading();
    addMsg('ai','连接失败: '+e.message,'❌');
  }
  sendBtn.disabled=false;
  input.focus();
}

// 连接
(async()=>{
  try{
    const h=await fetch(BASE+'/health').then(r=>r.json());
    await rpc('initialize',{protocolVersion:'2024-11-05',capabilities:{},clientInfo:{name:'redteam',version:'1.0'}});
    connected=true;
    statusEl.innerHTML='<span class="ok">● 已连接 · v'+h.version+'</span>';
    addMsg('ai','已连接。直接输入你的需求，我会自动执行。\n\n试试：\n· 逆向分析 /sdcard/app.apk\n· 扫描 192.168.1.1 端口\n· 检查设备安全\n· 进程列表\n· 局域网有哪些设备','RedTeam AI');
  }catch(e){
    statusEl.innerHTML='<span class="no">● 未连接，请先启动 MCP 服务</span>';
    addMsg('ai','连接失败，请先在应用中启动 MCP 服务。','❌');
  }
})();
</script>
</body>
</html>
